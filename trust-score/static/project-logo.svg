<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Fake Review Detection Logo</title>
  <desc id="logoDesc">Shield with magnifying glass representing AI-powered fake review detection</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="alertGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4F46E5" flood-opacity="0.3"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="0"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k1="0" k2="1" k3="-1" k4="0" result="shadowDiff"/>
      <feFlood flood-color="#C7D2FE" flood-opacity="0.5"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" filter="url(#softShadow)" />
  
  <!-- Subtle inner shine -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

  <!-- Shield body -->
  <path d="M256 88L376 140V248C376 332 328 396 256 428C184 396 136 332 136 248V140L256 88Z" fill="url(#shieldGrad)" opacity="0.95" />
  
  <!-- Shield inner shadow -->
  <path d="M256 112L356 156V248C356 320 316 376 256 404C196 376 156 320 156 248V156L256 112Z" fill="#1E1B4B" opacity="0.12" />

  <!-- Document/review card -->
  <rect x="196" y="176" width="120" height="80" rx="12" fill="#FFFFFF" opacity="0.95" />
  <rect x="212" y="196" width="88" height="8" rx="4" fill="#93C5FD" />
  <rect x="212" y="212" width="56" height="8" rx="4" fill="#BFDBFE" />
  <rect x="212" y="228" width="72" height="8" rx="4" fill="#DBEAFE" />

  <!-- Magnifying glass -->
  <circle cx="310" cy="310" r="44" fill="none" stroke="#FFFFFF" stroke-width="10" opacity="0.9" />
  <line x1="342" y1="342" x2="380" y2="380" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.9" />
  
  <!-- Check mark inside magnifying glass -->
  <path d="M286 312L302 328L334 292" fill="none" stroke="url(#checkGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Alert badge -->
  <circle cx="196" cy="316" r="28" fill="url(#alertGrad)" />
  <path d="M196 300V316" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
  <circle cx="196" cy="326" r="3.5" fill="#FFFFFF" />

  <!-- Sparkle dots for premium feel -->
  <circle cx="160" cy="120" r="4" fill="#C7D2FE" opacity="0.6" />
  <circle cx="380" cy="100" r="3" fill="#A5B4FC" opacity="0.5" />
  <circle cx="400" cy="420" r="5" fill="#C7D2FE" opacity="0.4" />
  <circle cx="120" cy="400" r="3.5" fill="#A5B4FC" opacity="0.5" />
</svg>
