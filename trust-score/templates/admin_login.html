<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Trust-Score</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            padding: 20px;
        }

        .login-card {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-bottom: 16px;
            object-fit: cover;
        }

        .login-header h1 {
            color: #f1f5f9;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .login-header p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-top: 6px;
        }

        .form-group {
            position: relative;
            margin-bottom: 20px;
        }

        .form-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 0.95rem;
            z-index: 2;
            pointer-events: none;
        }

        .form-group input {
            display: block;
            width: 100%;
            padding: 15px 16px 15px 46px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            background: #0f172a;
            color: #f1f5f9;
            font-size: 1rem;
            font-family: 'Outfit', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input::placeholder {
            color: #64748b;
        }

        .form-group input:focus {
            border-color: #3b82f6;
        }

        .btn-login {
            display: block;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 8px;
        }

        .btn-login:hover {
            opacity: 0.92;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: #f1f5f9;
        }

        .error-box {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.9rem;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
                border-radius: 16px;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }

            .login-header img {
                width: 56px;
                height: 56px;
            }

            .form-group input {
                padding: 13px 14px 13px 42px;
                font-size: 0.95rem;
            }

            .btn-login {
                padding: 13px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="login-header">
            <img src="{{ url_for('static', filename='trust-karo-logo.png') }}" alt="Trust-Score Logo" style="width: auto; height: 50px; border-radius: 0; object-fit: contain; margin-bottom: 24px;">
            <h1>Admin Panel</h1>
        </div>

        {% if error %}
        <div class="error-box">
            <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('admin_login') }}" method="POST">
            <div class="form-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" name="username" placeholder="Username" required autocomplete="off">
            </div>
            <div class="form-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" name="password" placeholder="Password" required autocomplete="off">
            </div>
            <button type="submit" class="btn-login">
                Login
            </button>
            <a href="/" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Back to Home
            </a>
        </form>
    </div>
</body>

</html>
