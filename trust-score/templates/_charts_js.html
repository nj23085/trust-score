<script>
    // =========================================
    // THEME TOGGLE
    // =========================================
    const toggleBtn = document.getElementById("themeToggle");
    const themeIcon = toggleBtn?.querySelector("i");

    function setTheme(isDark) {
        if (isDark) {
            document.body.classList.add("dark-mode");
            if (themeIcon) { themeIcon.classList.remove("fa-moon"); themeIcon.classList.add("fa-sun"); }
        } else {
            document.body.classList.remove("dark-mode");
            if (themeIcon) { themeIcon.classList.remove("fa-sun"); themeIcon.classList.add("fa-moon"); }
        }
    }

    if (localStorage.getItem("theme") === "dark" ||
        (!localStorage.getItem("theme") && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        setTheme(true);
    }

    toggleBtn?.addEventListener("click", function () {
        const isDark = !document.body.classList.contains("dark-mode");
        setTheme(isDark);
        localStorage.setItem("theme", isDark ? "dark" : "light");

        if (window.myCharts) {
            const textColor = getComputedStyle(document.body)
                .getPropertyValue("--text-2").trim() || "#64748b";
            const gridColor = getComputedStyle(document.body)
                .getPropertyValue("--border-strong").trim() || "rgba(203,213,225,0.4)";
            window.myCharts.forEach(chart => {
                chart.update({
                    xAxis: { labels: { style: { color: textColor } }, gridLineColor: gridColor },
                    yAxis: { labels: { style: { color: textColor } }, gridLineColor: gridColor },
                    plotOptions: {
                        pie: { dataLabels: { style: { color: textColor } }, borderColor: textColor },
                        column: { dataLabels: { style: { color: textColor } } }
                    }
                });
            });
        }
    });

    // =========================================
    // LEGACY LOADING OVERLAY (no job_id path)
    // Only fires when the extension is NOT active (homeLoadingOverlay not showing)
    // =========================================
    const analyzeForm = document.getElementById("analyzeForm");
    if (analyzeForm) {
        analyzeForm.addEventListener("submit", function () {
            // If the home overlay is already showing (extension active), do nothing
            const homeOvl = document.getElementById("homeLoadingOverlay");
            if (homeOvl && homeOvl.style.display === "flex") return;

            const overlay = document.getElementById("loadingOverlay");
            const bar = document.getElementById("progressBar");
            if (!overlay) return;
            let width = 0;
            overlay.style.display = "flex";
            overlay.classList.add("fade-in");
            const interval = setInterval(function () {
                if (width >= 95) {
                    clearInterval(interval);
                } else {
                    width += Math.random() * 5 + 1;
                    if (width > 95) width = 95;
                    bar.style.width = width + "%";
                }
            }, 300);
        });
    }

    // =========================================
    // DASHBOARD TAB SWITCHING
    // =========================================
    function switchTab(tabId) {
        document.querySelectorAll('.dashboard-tab').forEach(t => {
            t.classList.remove('active');
            t.setAttribute('aria-selected', 'false');
        });
        document.querySelectorAll('.dashboard-panel').forEach(p => {
            p.classList.remove('active');
        });

        const tab = document.getElementById('tab-' + tabId);
        const panel = document.getElementById('panel-' + tabId);
        if (tab) { tab.classList.add('active'); tab.setAttribute('aria-selected', 'true'); }
        if (panel) { panel.classList.add('active'); }

        // Track tab navigation in Google Analytics
        if (typeof gtag !== 'undefined') {
            const tabNames = {
                'overview': 'Overview',
                'analysis': 'Analysis',
                'prices': 'Price Comparison',
                'similar': 'Similar Products'
            };
            const tabName = tabNames[tabId] || tabId;
            gtag('event', 'view_analysis_tab', {
                'tab_name': tabName,
                'tab_id': tabId
            });
            console.log(`[Analytics] Viewed tab: ${tabName}`);
        }

        if (window.myCharts) {
            setTimeout(() => {
                window.myCharts.forEach(chart => { try { chart.reflow(); } catch (e) { } });
            }, 100);
        }
    }

    // =========================================
    // COUNTER-UP ANIMATION
    // =========================================
    function animateCounter(el) {
        const target = parseInt(el.textContent, 10);
        if (isNaN(target)) return;
        const duration = 1000;
        const step = Math.ceil(target / (duration / 16));
        let current = 0;
        const timer = setInterval(() => {
            current += step;
            if (current >= target) { current = target; clearInterval(timer); }
            el.textContent = current;
        }, 16);
    }

    // =========================================
    // CHART RENDERING
    // =========================================
    const chartDataEl = document.getElementById("chartData");
    if (chartDataEl) {
        const fake = parseInt(chartDataEl.dataset.fake);
        const genuine = parseInt(chartDataEl.dataset.genuine);
        const fakePercentage = parseFloat(chartDataEl.dataset.fakepercentage);
        const genuinePerc = parseFloat(chartDataEl.dataset.genuinepercentage);
        const trustScore = parseFloat(chartDataEl.dataset.trust_score) || 0;
        const totalReviews = parseInt(chartDataEl.dataset.total) || 0;
        const productTitle = chartDataEl.dataset.product || 'Product';
        const keywordLabels = JSON.parse(chartDataEl.dataset.keywordlabels);
        const keywordValues = JSON.parse(chartDataEl.dataset.keywordvalues);

        const scoreExplanationOverlay = document.getElementById('scoreExplanationOverlay');
        const smartVerdictOverlay = document.getElementById('smartVerdictOverlay');
        const openScoreExplanationBtn = document.getElementById('openScoreExplanationBtn');
        const scoreExplanationClose = document.getElementById('scoreExplanationClose');
        const smartVerdictClose = document.getElementById('smartVerdictClose');
        const viewEvidenceBtn = document.getElementById('viewEvidenceBtn');
        const comparePricesBtn = document.getElementById('comparePricesBtn');
        const findAlternativesBtn = document.getElementById('findAlternativesBtn');
        const scoreExplanationAuthenticity = document.getElementById('scoreExplanationAuthenticity');
        const scoreExplanationRepetition = document.getElementById('scoreExplanationRepetition');
        const scoreExplanationBurst = document.getElementById('scoreExplanationBurst');
        const scoreExplanationVerified = document.getElementById('scoreExplanationVerified');
        const scoreExplanationNote = document.getElementById('scoreExplanationNote');
        const smartVerdictTitle = document.getElementById('smartVerdictTitle');
        const smartVerdictCopy = document.getElementById('smartVerdictCopy');
        const smartVerdictTag = document.getElementById('smartVerdictTag');
        const smartVerdictIcon = document.getElementById('smartVerdictIcon');
        const smartVerdictTrustPill = document.getElementById('smartVerdictTrustPill');
        const smartVerdictRiskPill = document.getElementById('smartVerdictRiskPill');

        function showOverlay(overlay) {
            if (!overlay) return;
            overlay.classList.remove('tg-hidden', 'tg-closing');
        }

        function hideOverlay(overlay, after) {
            if (!overlay) return;
            overlay.classList.add('tg-closing');
            setTimeout(function () {
                overlay.classList.add('tg-hidden');
                overlay.classList.remove('tg-closing');
                if (typeof after === 'function') after();
            }, 300);
        }

        function populateScoreExplanation() {
            const authenticity = Math.round((genuine / Math.max(totalReviews, 1)) * 100);
            const repetition = fakePercentage <= 10 ? 'Low' : fakePercentage <= 30 ? 'Moderate' : fakePercentage <= 60 ? 'High' : 'Very high';
            const burst = fakePercentage <= 10 ? 'None' : fakePercentage <= 30 ? 'Low' : fakePercentage <= 60 ? 'Moderate' : 'High';
            const verified = trustScore >= 7.5 ? 'Strong' : trustScore >= 4.5 ? 'Moderate' : 'Weak';

            if (scoreExplanationAuthenticity) scoreExplanationAuthenticity.textContent = authenticity + '%';
            if (scoreExplanationRepetition) scoreExplanationRepetition.textContent = repetition;
            if (scoreExplanationBurst) scoreExplanationBurst.textContent = burst;
            if (scoreExplanationVerified) scoreExplanationVerified.textContent = verified;
            if (scoreExplanationNote) {
                scoreExplanationNote.textContent = `This analysis is based on ${totalReviews} reviews, with ${genuine} marked genuine and ${fake} flagged as suspicious.`;
            }
        }

        function openScoreExplanation() {
            populateScoreExplanation();
            showOverlay(scoreExplanationOverlay);
        }

        function closeScoreExplanation() {
            hideOverlay(scoreExplanationOverlay);
        }

        function getVerdictData() {
            if (trustScore >= 7.5) {
                return {
                    key: 'safe',
                    title: 'Safe to consider',
                    copy: 'Most review signals are healthy. The product looks trustworthy, though it is still worth checking the evidence before you buy.',
                    tagClass: 'safe-tag',
                    iconClass: 'safe-icon',
                    icon: 'fa-solid fa-circle-check'
                };
            }

            if (trustScore >= 4.5) {
                return {
                    key: 'pause',
                    title: 'Pause before buying',
                    copy: 'The signal is mixed. Review the evidence, compare prices, and inspect alternatives before you decide.',
                    tagClass: 'pause-tag',
                    iconClass: 'pause-icon',
                    icon: 'fa-solid fa-triangle-exclamation'
                };
            }

            return {
                key: 'high-risk',
                title: 'High fake-review risk detected',
                copy: 'The review pattern looks heavily manipulated. Compare options carefully and avoid relying on the headline rating alone.',
                tagClass: 'high-risk-tag',
                iconClass: 'high-risk-icon',
                icon: 'fa-solid fa-circle-xmark'
            };
        }

        function populateVerdictPopup() {
            const verdict = getVerdictData();
            if (smartVerdictTitle) smartVerdictTitle.textContent = verdict.title;
            if (smartVerdictCopy) smartVerdictCopy.textContent = verdict.copy;
            if (smartVerdictTag) {
                smartVerdictTag.classList.remove('safe-tag', 'pause-tag', 'high-risk-tag');
                smartVerdictTag.classList.add(verdict.tagClass);
            }
            if (smartVerdictIcon) {
                smartVerdictIcon.classList.remove('safe-icon', 'pause-icon', 'high-risk-icon');
                smartVerdictIcon.classList.add(verdict.iconClass);
                smartVerdictIcon.innerHTML = `<i class="${verdict.icon}"></i>`;
            }
            if (smartVerdictTrustPill) smartVerdictTrustPill.textContent = `Trust score: ${trustScore.toFixed(1)}/10`;
            if (smartVerdictRiskPill) smartVerdictRiskPill.textContent = `Fake reviews: ${Math.round(fakePercentage)}%`;
            return verdict;
        }

        function maybeShowVerdictPopup() {
            if (!smartVerdictOverlay || totalReviews < 5) return;
            const verdict = populateVerdictPopup();
            const productSlug = String(productTitle || 'product').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            const verdictKey = `trust_score_verdict_seen_${verdict.key}_${productSlug}`;

            try {
                if (localStorage.getItem(verdictKey) === 'true') return;
                localStorage.setItem(verdictKey, 'true');
            } catch (e) {
                // localStorage may be unavailable in private browsing modes.
            }

            setTimeout(function () {
                showOverlay(smartVerdictOverlay);
            }, 650);
        }

        openScoreExplanationBtn && openScoreExplanationBtn.addEventListener('click', openScoreExplanation);
        scoreExplanationClose && scoreExplanationClose.addEventListener('click', closeScoreExplanation);
        scoreExplanationOverlay && scoreExplanationOverlay.querySelector('.tg-popup-backdrop') &&
            scoreExplanationOverlay.querySelector('.tg-popup-backdrop').addEventListener('click', closeScoreExplanation);

        smartVerdictClose && smartVerdictClose.addEventListener('click', function () {
            hideOverlay(smartVerdictOverlay);
        });
        smartVerdictOverlay && smartVerdictOverlay.querySelector('.tg-popup-backdrop') &&
            smartVerdictOverlay.querySelector('.tg-popup-backdrop').addEventListener('click', function () {
                hideOverlay(smartVerdictOverlay);
            });

        viewEvidenceBtn && viewEvidenceBtn.addEventListener('click', function () {
            hideOverlay(smartVerdictOverlay, function () {
                switchTab('analysis');
                openScoreExplanation();
            });
        });
        comparePricesBtn && comparePricesBtn.addEventListener('click', function () {
            hideOverlay(smartVerdictOverlay, function () {
                switchTab('prices');
            });
        });
        findAlternativesBtn && findAlternativesBtn.addEventListener('click', function () {
            hideOverlay(smartVerdictOverlay, function () {
                switchTab('similar');
            });
        });

        document.addEventListener('keydown', function (event) {
            if (event.key !== 'Escape') return;
            if (scoreExplanationOverlay && !scoreExplanationOverlay.classList.contains('tg-hidden')) {
                closeScoreExplanation();
            } else if (smartVerdictOverlay && !smartVerdictOverlay.classList.contains('tg-hidden')) {
                hideOverlay(smartVerdictOverlay);
            }
        });

        window.myCharts = [];

        const textColor = getComputedStyle(document.body).getPropertyValue("--text-2").trim() || "#64748b";
        const gridColor = getComputedStyle(document.body).getPropertyValue("--border-strong").trim() || "rgba(203,213,225,0.4)";
        const RED = "#ef4444";
        const GREEN = "#10b981";

        // ---- Gauge helpers ----
        function makeGauge(canvasId, pct) {
            const el = document.getElementById(canvasId);
            if (!el) return;
            const color = pct > 50 ? RED : pct > 20 ? "#f59e0b" : GREEN;
            const chart = Highcharts.chart(canvasId, {
                chart: {
                    type: 'pie',
                    backgroundColor: 'transparent',
                    options3d: { enabled: true, alpha: 45 }
                },
                title: { text: null },
                plotOptions: {
                    pie: {
                        innerSize: '70%',
                        depth: 45,
                        startAngle: -90,
                        endAngle: 90,
                        center: ['50%', '75%'],
                        size: '110%',
                        dataLabels: { enabled: false },
                        colors: [color, getComputedStyle(document.body).getPropertyValue("--surface-3").trim() || "rgba(148,163,184,0.2)"],
                        borderWidth: 0
                    }
                },
                credits: { enabled: false },
                tooltip: { enabled: false },
                series: [{
                    name: 'Risk',
                    data: [
                        { name: 'Fake', y: pct },
                        { name: 'Genuine', y: 100 - pct }
                    ]
                }]
            });
            window.myCharts.push(chart);
        }

        makeGauge("gaugeChart", fakePercentage);

        // ---- Doughnut ----
        function makeDoughnut(canvasId) {
            const el = document.getElementById(canvasId);
            if (!el) return;
            const chart = Highcharts.chart(canvasId, {
                chart: {
                    type: 'pie',
                    backgroundColor: 'transparent',
                    options3d: { enabled: true, alpha: 45 }
                },
                title: { text: null },
                plotOptions: {
                    pie: {
                        innerSize: '40%',
                        depth: 45,
                        dataLabels: {
                            enabled: true,
                            format: '{point.name}: {point.y}%',
                            style: { color: textColor, textOutline: 'none', fontSize: '14px' }
                        },
                        colors: [RED, GREEN],
                        borderWidth: 1,
                        borderColor: 'transparent'
                    }
                },
                credits: { enabled: false },
                tooltip: { pointFormat: '{series.name}: <b>{point.y}%</b>' },
                series: [{
                    name: 'Ratio',
                    data: [
                        { name: 'Fake', y: fakePercentage },
                        { name: 'Genuine', y: genuinePerc }
                    ]
                }]
            });
            window.myCharts.push(chart);
        }

        makeDoughnut("doughnutChart");

        maybeShowVerdictPopup();

        // ---- Bar chart ----
        const barEl = document.getElementById("barChart");
        if (barEl) {
            const chart = Highcharts.chart("barChart", {
                chart: {
                    type: 'column',
                    backgroundColor: 'transparent',
                    options3d: { enabled: true, alpha: 15, beta: 15, depth: 50, viewDistance: 25 }
                },
                title: { text: null },
                xAxis: {
                    categories: ['Fake', 'Genuine'],
                    labels: { style: { color: textColor, fontSize: '14px' } },
                    gridLineColor: gridColor
                },
                yAxis: {
                    title: { text: null },
                    labels: { style: { color: textColor } },
                    gridLineColor: gridColor
                },
                plotOptions: {
                    column: {
                        depth: 25,
                        colorByPoint: true,
                        colors: [RED, GREEN],
                        dataLabels: {
                            enabled: true,
                            style: { color: textColor, textOutline: 'none', fontSize: '14px' }
                        }
                    }
                },
                legend: { enabled: false },
                credits: { enabled: false },
                series: [{
                    name: 'Reviews',
                    data: [fake, genuine]
                }]
            });
            window.myCharts.push(chart);
        }

        // ---- Parse Reviews Data ----
        const reviewsDataEl = document.getElementById("reviewsData");
        let reviews = [];
        if (reviewsDataEl) {
            try {
                reviews = JSON.parse(reviewsDataEl.textContent);
            } catch (e) { }
        }

        // ---- Review Length Horizontal Bar Chart (Changed to Vertical 3D Column) ----
        const lengthEl = document.getElementById("lengthChart");
        if (lengthEl && reviews.length > 0) {
            let fakeTotalWords = 0;
            let genuineTotalWords = 0;
            let fakeCountLen = 0;
            let genuineCountLen = 0;

            reviews.forEach(r => {
                const len = r.review ? r.review.trim().split(/\s+/).length : 0;
                if (r.prediction === 'fake') {
                    fakeTotalWords += len;
                    fakeCountLen++;
                } else {
                    genuineTotalWords += len;
                    genuineCountLen++;
                }
            });

            const avgFakeLen = fakeCountLen > 0 ? Math.round(fakeTotalWords / fakeCountLen) : 0;
            const avgGenLen = genuineCountLen > 0 ? Math.round(genuineTotalWords / genuineCountLen) : 0;

            const chart = Highcharts.chart("lengthChart", {
                chart: {
                    type: 'column',
                    backgroundColor: 'transparent',
                    options3d: { enabled: true, alpha: 15, beta: 15, depth: 50, viewDistance: 25 }
                },
                title: { text: null },
                xAxis: {
                    categories: ['Fake Reviews', 'Genuine Reviews'],
                    labels: { style: { color: textColor, fontSize: '14px' } },
                    gridLineColor: gridColor
                },
                yAxis: {
                    title: { text: null },
                    labels: { style: { color: textColor } },
                    gridLineColor: gridColor
                },
                plotOptions: {
                    column: {
                        depth: 25,
                        colorByPoint: true,
                        colors: [RED, GREEN],
                        dataLabels: {
                            enabled: true,
                            format: '{point.y} words',
                            style: { color: textColor, textOutline: 'none', fontSize: '14px' }
                        }
                    }
                },
                legend: { enabled: false },
                credits: { enabled: false },
                series: [{
                    name: 'Avg Word Count',
                    data: [avgFakeLen, avgGenLen]
                }]
            });
            window.myCharts.push(chart);
        }

        // ---- Counter-up on visible numbers ----
        document.querySelectorAll('.counter-up').forEach(animateCounter);

        // ---- Scroll-reveal ----
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.slide-up, .fade-in').forEach(el => observer.observe(el));
    }
</script>
